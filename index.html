<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./static/style.css">

    <title>Media tracker</title>
</head>

<body>
    <main>
        <h1>Media tracker</h1>

        <h2>Database</h2>
        <ul id="database"></ul>

        <h2>Activities</h2>
        <div id="timeline" class="activity"></div>
    </main>
    <footer>
        <img src="https://lukenk.github.io/print/letterhead.svg" style="height: inherit;">
        <a>LukeNK</a>
    </footer>
</body>

<script>
let timeline = {
    start: new Date('2026-01-01'),
    end: new Date(),
};

(async () => {
    // Download database
    let data = await fetch('./database.json');
    const database = await data.json();
    console.log(database);

    // Populate table
    const tableBody = document.getElementById('database');
    for (const entry of database) {
        const item = document.createElement('li'),
            info = document.createElement('div'),
            activity = document.createElement('div');

        info.classList.add('info');
        info.innerHTML = `
            <span class="short">${entry.length}</span><span class="long">${entry.category}</span>
            <span class="short">${entry.status}</span><span class="long">${entry.name}</span>`;

        activity.classList.add('activity');
        let latestActivity = '';
        for (const key in entry.activity) {
            const itemProgress = document.createElement('span');
            let progressPercent = (new Date(key) - timeline.start) / (timeline.end - timeline.start);
            progressPercent = Math.max(progressPercent, 0);
            itemProgress.style.width = `${progressPercent * 100}%`;
            activity.appendChild(itemProgress);
            latestActivity = key;
        }
        if (latestActivity)
            activity.innerHTML += `<p>${entry.activity[latestActivity]} (${latestActivity})</p>`;

        item.appendChild(info);
        item.appendChild(activity);
        tableBody.appendChild(item);
    }

    // Timeline
    const timelineBar = document.getElementById('timeline');
    for (const entry of database)
        for (const key in entry.activity) {
            const itemProgress = document.createElement('span');
            let progressPercent = (new Date(key) - timeline.start) / (timeline.end - timeline.start);
            progressPercent = Math.max(progressPercent, 0);
            itemProgress.style.width = `${progressPercent * 100}%`;
            timelineBar.appendChild(itemProgress);
        }
})();
</script>
</html>
