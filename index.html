<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/static/style.css">

    <title>Media tracker</title>
</head>

<body>
    <main>
        <h1>Media tracker</h1>

        <div class="overflow">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <td>Progress</td>
                    </tr>
                </thead>
                <tbody id="database-body">
                </tbody>
            </table>
        </div>
    </main>
    <footer>
        <img src="https://lukenk.github.io/print/letterhead.svg" style="height: inherit;">
        <a href="https://lyricstranslate.com/en/translator/lukenk">LukeNK</a>
    </footer>
</body>

<script>
let timeline = {
    start: new Date('2026-01-01'),
    end: new Date('2026-12-31'),
};

(async () => {
    // Download database
    let data = await fetch('/database');
    const database = await data.json();
    console.log(database);

    // Populate table
    const tableBody = document.getElementById('database-body');
    for (const entry of database) {
        const row = document.createElement('tr'),
            name = document.createElement('td'),
            progress = document.createElement('td'),
            proInfo = document.createElement('span');

        name.textContent = entry.name;

        // Handle progress
        progress.classList.add('progress');
        for (const key in entry.progress) {
            const itemProgress = document.createElement('div');
            const progressPercent = (new Date(key) - timeline.start) / (timeline.end - timeline.start);
            itemProgress.style.width = `${progressPercent * 100}%`;
            progress.appendChild(itemProgress);

            proInfo.innerHTML += `${entry.progress[key]} on ${key}<br>`;
        }

        progress.appendChild(proInfo);
        row.appendChild(name);
        row.appendChild(progress);
        tableBody.appendChild(row);
    }
})();
</script>
</html>
